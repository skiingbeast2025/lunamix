<!DOCTYPE html>
<html lang="en" data-theme="nautilus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Retro Emulator | Lunamix</title>
  <meta name="description" content="Universal WebAssembly retro emulator for GBA, SNES, N64, NDS, NES, Genesis, and PS1 with drag-and-drop ROM loading and save states.">
  <link rel="shortcut icon" href="./assets/logos/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- NautilusOS Design System Stylesheet -->
  <link rel="stylesheet" href="./assets/css/nautilus.css">

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #121724;
      --window-chrome: #141926;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #7dd3c0;
      --accent-hover: #6bc4b0;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    body.is-embedded header {
      display: none !important;
    }
    body.is-embedded #game-container {
      height: 100vh !important;
    }

    header {
      height: 48px;
      background: var(--window-chrome);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.85rem;
      z-index: 20;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border-subtle);
      margin: 0 0.25rem;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-icon {
      color: var(--accent);
      font-size: 0.9rem;
    }

    .title-text {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .core-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: rgba(125, 211, 192, 0.12);
      color: var(--accent);
      border: 1px solid rgba(125, 211, 192, 0.25);
    }

    .cloak-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .select-icon {
      position: absolute;
      left: 0.55rem;
      font-size: 0.7rem;
      color: var(--accent);
      pointer-events: none;
    }

    .cloak-select {
      appearance: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.32rem 1.6rem 0.32rem 1.65rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      outline: none;
    }

    .cloak-arrow {
      position: absolute;
      right: 0.55rem;
      font-size: 0.6rem;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .panic-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.32rem 0.65rem;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--danger);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .panic-btn:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .panic-key-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.05rem 0.3rem;
      border-radius: 3px;
    }

    #game-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px);
      background: #000;
      position: relative;
    }

    #webretro-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: block;
    }
  </style>
</head>
<body class="nautilus-theme">

  <header>
    <div class="header-left">
      <a href="./games.html" class="nav-btn" title="Back to Games catalog">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Games</span>
      </a>
      <div class="divider"></div>
      <div class="header-title-box">
        <i class="fa-solid fa-gamepad header-icon"></i>
        <span id="emu-title" class="title-text">Universal Retro Emulator</span>
        <span id="emu-core-badge" class="core-pill">WEBRETRO</span>
      </div>
    </div>

    <div class="header-right">
      <a href="https://skiingbeast2025.github.io/webretro/" target="_blank" rel="noopener noreferrer" class="nav-btn" title="Open Fullscreen in New Tab">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <span>New Tab</span>
      </a>

      <button type="button" onclick="LunamixTheme.openModal()" class="nav-btn" title="Select Theme">
        <i class="fa-solid fa-palette"></i>
        <span>Themes</span>
      </button>

      <div class="cloak-select-wrap">
        <i class="fa-solid fa-shield-halved select-icon"></i>
        <select id="nav-tab-cloak" class="cloak-select" onchange="LunamixCloak.apply(this.value)" title="Stealth Tab Cloak">
          <option value="default">Cloak: Default</option>
          <option value="classroom">Google Classroom</option>
          <option value="drive">Google Drive</option>
          <option value="canvas">Canvas LMS</option>
          <option value="docs">Google Docs</option>
        </select>
        <i class="fa-solid fa-chevron-down cloak-arrow"></i>
      </div>

      <button type="button" onclick="LunamixPanic.trigger()" class="panic-btn" title="Emergency Panic Redirect">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Panic</span>
        <kbd class="panic-key-label">~</kbd>
      </button>
    </div>
  </header>

  <main id="game-container">
    <iframe
      id="webretro-iframe"
      src="https://skiingbeast2025.github.io/webretro/"
      allow="autoplay; fullscreen; gamepad; focus-without-user-activation *"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals">
    </iframe>
  </main>

  <script src="./assets/js/lunamix-core.js"></script>
  <script>
    (function initWebRetroEmbed() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('embed') === '1' || window.self !== window.top) {
        document.body.classList.add('is-embedded');
      }

      const CORE_MAP = {
        'gba': 'mgba',
        'gb': 'mgba',
        'gbc': 'mgba',
        'snes': 'snes9x',
        'n64': 'mupen64plus_next',
        'nes': 'nestopia',
        'genesis': 'genesis_plus_gx',
        'segaMD': 'genesis_plus_gx',
        'nds': 'melonds',
        'psx': 'mednafen_psx_hw',
        'ps1': 'mednafen_psx_hw'
      };

      const core = urlParams.get('core');
      const rom = urlParams.get('rom');
      const title = urlParams.get('title');
      const iframe = document.getElementById('webretro-iframe');

      if (title) {
        const titleEl = document.getElementById('emu-title');
        if (titleEl) titleEl.textContent = title;
      }

      if (core || rom) {
        const forwardParams = new URLSearchParams();
        if (core) {
          const mappedCore = CORE_MAP[core] || core;
          forwardParams.set('core', mappedCore);
          const badgeEl = document.getElementById('emu-core-badge');
          if (badgeEl) badgeEl.textContent = mappedCore.toUpperCase();
        }
        if (rom) {
          forwardParams.set('rom', rom);
        }
        if (iframe) {
          iframe.src = 'https://skiingbeast2025.github.io/webretro/?' + forwardParams.toString();
        }
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GeoDash (Online)</title>
    <!-- Load the community geometry-dash-wasm build from jsDelivr which includes the full online/event menus. -->
    <!-- We embed it in an iframe so the original pack/minified bundling in this repo is not modified. -->
    <style>html,body,iframe{height:100%;width:100%;margin:0;padding:0;border:0}iframe{display:block}</style>
  </head>
  <body>
    <iframe src="https://cdn.jsdelivr.net/gh/cgeometrydash/geometrydash-wasm@main/index.html" title="Geometry Dash WASM (Online)" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <!-- If the iframe is blocked by the browser or CDN, open the game in a new tab using this link: -->
    <noscript>
      <p>JavaScript is required — open the game directly: <a href="https://cdn.jsdelivr.net/gh/cgeometrydash/geometrydash-wasm@main/index.html" target="_blank">Open Geometry Dash WASM (official build)</a></p>
    </noscript>
  </body>
</html>

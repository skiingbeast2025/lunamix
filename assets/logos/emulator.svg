<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" fill="#120c1f" rx="16"/>
  <!-- Retro Controller Silhouette -->
  <g transform="translate(10, 24)">
    <!-- Controller Body -->
    <rect x="5" y="10" width="70" height="36" rx="18" fill="#2d1f4d" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="20" cy="28" r="14" fill="#3b2d63"/>
    <circle cx="60" cy="28" r="14" fill="#3b2d63"/>
    
    <!-- D-Pad -->
    <rect x="18" y="20" width="4" height="16" fill="#c4b5fd" rx="1"/>
    <rect x="12" y="26" width="16" height="4" fill="#c4b5fd" rx="1"/>
    
    <!-- Action Buttons -->
    <circle cx="56" cy="32" r="3" fill="#ec4899"/>
    <circle cx="64" cy="24" r="3" fill="#a855f7"/>
    
    <!-- Select / Start -->
    <rect x="33" y="30" width="5" height="2" rx="1" fill="#94a3b8" transform="rotate(-25 35 31)"/>
    <rect x="42" y="30" width="5" height="2" rx="1" fill="#94a3b8" transform="rotate(-25 44 31)"/>
  </g>
</svg>

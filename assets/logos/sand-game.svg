<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="sandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="4" />
  
  <!-- Hourglass / Falling Sand Icon -->
  <g transform="translate(136, 116)" filter="url(#sandGlow)">
    <!-- Frame -->
    <path d="M 20 20 L 220 20 C 220 20 200 120 135 140 C 200 160 220 260 220 260 L 20 260 C 20 260 40 160 105 140 C 40 120 20 20 20 20 Z" 
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top & Bottom Plates -->
    <rect x="0" y="8" width="240" height="16" rx="8" fill="#f59e0b" />
    <rect x="0" y="256" width="240" height="16" rx="8" fill="#f59e0b" />
    
    <!-- Top Sand Pile -->
    <path d="M 45 40 Q 120 80 195 40 Q 160 100 125 135 Q 80 100 45 40 Z" fill="url(#sandGrad)" opacity="0.9" />
    
    <!-- Falling Stream -->
    <line x1="120" y1="135" x2="120" y2="210" stroke="#fef08a" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
    
    <!-- Bottom Sand Mound -->
    <path d="M 40 250 Q 120 180 200 250 Z" fill="url(#sandGrad)" />
    
    <!-- Particle dots -->
    <circle cx="115" cy="155" r="4" fill="#fde047" />
    <circle cx="125" cy="175" r="3.5" fill="#fde047" />
    <circle cx="118" cy="195" r="4" fill="#fde047" />
  </g>
</svg>